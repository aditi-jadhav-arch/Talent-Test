openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Quiz Application API for recruitment
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: quizzes
    description: Quiz management
  - name: questions
    description: Question management
  - name: candidates
    description: Candidate management
  - name: attempts
    description: Quiz attempt management
  - name: analytics
    description: Analytics and reporting
paths:
  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/candidate/login:
    post:
      operationId: candidateLogin
      tags: [auth]
      summary: Candidate login by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "404":
          description: Candidate not found

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List all quizzes
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
    post:
      operationId: createQuiz
      tags: [quizzes]
      summary: Create a new quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /quizzes/{id}:
    get:
      operationId: getQuiz
      tags: [quizzes]
      summary: Get quiz by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "404":
          description: Not found
    patch:
      operationId: updateQuiz
      tags: [quizzes]
      summary: Update quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
    delete:
      operationId: deleteQuiz
      tags: [quizzes]
      summary: Delete quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /quizzes/{quizId}/questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions for a quiz
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Create a question
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /quizzes/{quizId}/questions/{id}:
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Update a question
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List all candidates
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Register a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get candidate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Delete candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /attempts:
    get:
      operationId: listAttempts
      tags: [attempts]
      summary: List all quiz attempts
      parameters:
        - name: quizId
          in: query
          schema:
            type: integer
        - name: candidateId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attempt"
    post:
      operationId: startAttempt
      tags: [attempts]
      summary: Start a quiz attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"

  /attempts/{id}:
    get:
      operationId: getAttempt
      tags: [attempts]
      summary: Get attempt by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptDetail"
        "404":
          description: Not found

  /attempts/{id}/submit:
    post:
      operationId: submitAttempt
      tags: [attempts]
      summary: Submit a quiz attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptSubmission"
      responses:
        "200":
          description: Attempt submitted and scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/quizzes/{quizId}/performance:
    get:
      operationId: getQuizPerformance
      tags: [analytics]
      summary: Get performance stats for a quiz
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizPerformance"

  /analytics/recent-attempts:
    get:
      operationId: getRecentAttempts
      tags: [analytics]
      summary: Get recent quiz attempts
      responses:
        "200":
          description: Recent attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentAttempt"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Quiz:
      type: object
      required: [id, title, description, category, durationMinutes, passingScore, status, questionCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        passingScore:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]
        questionCount:
          type: integer
        createdAt:
          type: string

    QuizInput:
      type: object
      required: [title, description, category, durationMinutes, passingScore]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        passingScore:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]

    QuizUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        passingScore:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]

    Question:
      type: object
      required: [id, quizId, text, type, points, orderIndex, options, correctAnswer]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, short_answer]
        points:
          type: integer
        orderIndex:
          type: integer
        options:
          type: ["array", "null"]
          items:
            type: string
        correctAnswer:
          type: string

    QuestionInput:
      type: object
      required: [text, type, points, correctAnswer]
      properties:
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, short_answer]
        points:
          type: integer
        orderIndex:
          type: integer
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string

    QuestionUpdate:
      type: object
      properties:
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, true_false, short_answer]
        points:
          type: integer
        orderIndex:
          type: integer
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string

    Candidate:
      type: object
      required: [id, name, email, phone, department, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        createdAt:
          type: string

    CandidateInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string

    Attempt:
      type: object
      required: [id, quizId, candidateId, status, startedAt, score, candidateName, quizTitle]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        candidateId:
          type: integer
        status:
          type: string
          enum: [in_progress, completed, abandoned]
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        score:
          type: ["integer", "null"]
        passed:
          type: ["boolean", "null"]
        candidateName:
          type: string
        quizTitle:
          type: string

    AttemptDetail:
      type: object
      required: [id, quizId, candidateId, status, startedAt, score, quiz, candidate, answers]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        candidateId:
          type: integer
        status:
          type: string
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        score:
          type: ["integer", "null"]
        passed:
          type: ["boolean", "null"]
        quiz:
          $ref: "#/components/schemas/Quiz"
        candidate:
          $ref: "#/components/schemas/Candidate"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"

    Answer:
      type: object
      required: [id, questionId, givenAnswer, isCorrect, pointsAwarded]
      properties:
        id:
          type: integer
        questionId:
          type: integer
        givenAnswer:
          type: ["string", "null"]
        isCorrect:
          type: ["boolean", "null"]
        pointsAwarded:
          type: integer

    AttemptInput:
      type: object
      required: [quizId, candidateId]
      properties:
        quizId:
          type: integer
        candidateId:
          type: integer

    AttemptSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerInput"

    AnswerInput:
      type: object
      required: [questionId, givenAnswer]
      properties:
        questionId:
          type: integer
        givenAnswer:
          type: string

    AttemptResult:
      type: object
      required: [id, score, totalPoints, passed, correctCount, totalQuestions]
      properties:
        id:
          type: integer
        score:
          type: integer
        totalPoints:
          type: integer
        passed:
          type: boolean
        correctCount:
          type: integer
        totalQuestions:
          type: integer

    DashboardStats:
      type: object
      required: [totalQuizzes, activeQuizzes, totalCandidates, totalAttempts, completedAttempts, passRate, recentActivity]
      properties:
        totalQuizzes:
          type: integer
        activeQuizzes:
          type: integer
        totalCandidates:
          type: integer
        totalAttempts:
          type: integer
        completedAttempts:
          type: integer
        passRate:
          type: number
        recentActivity:
          type: integer

    QuizPerformance:
      type: object
      required: [quizId, quizTitle, totalAttempts, completedAttempts, averageScore, passRate, highestScore, lowestScore]
      properties:
        quizId:
          type: integer
        quizTitle:
          type: string
        totalAttempts:
          type: integer
        completedAttempts:
          type: integer
        averageScore:
          type: number
        passRate:
          type: number
        highestScore:
          type: integer
        lowestScore:
          type: integer

    RecentAttempt:
      type: object
      required: [id, candidateName, quizTitle, score, passed, status, completedAt]
      properties:
        id:
          type: integer
        candidateName:
          type: string
        quizTitle:
          type: string
        score:
          type: ["integer", "null"]
        passed:
          type: ["boolean", "null"]
        status:
          type: string
        completedAt:
          type: ["string", "null"]

    AdminLoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CandidateLoginBody:
      type: object
      required: [email]
      properties:
        email:
          type: string

    AuthUser:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, candidate]
